name: Matrix

# 全内核线构建：先生成 matrix（脚本，可本地跑/可单测），再按 matrix 复用 build.yml。
on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "KernelSU 版本"
        type: choice
        default: sukisu-13000
        options: [sukisu-13000, sukisu-12807, sukisu-stable, official-stable, next-stable, resukisu-stable]
      features:
        description: "功能（逗号分隔）"
        type: string
        default: "susfs,kpm,zram_enhanced,zram_full_algos,bbg,ntsync,net_enhanced,rekernel"
      include_612:
        description: "是否包含 android16-6.12"
        type: boolean
        default: false

jobs:
  prepare:
    name: 生成 matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gen
        run: |
          python .github/scripts/gen_matrix.py \
            --with-612 "${{ inputs.include_612 }}" >> "$GITHUB_OUTPUT"
      - run: echo '${{ steps.gen.outputs.matrix }}'

  build:
    name: ${{ matrix.line }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      android: ${{ matrix.android }}
      kernel: ${{ matrix.kernel }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: latest
      ksu: ${{ inputs.ksu }}
      features: ${{ inputs.features }}
      zram_algos: ""
