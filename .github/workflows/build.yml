name: Build

# 设计：workflow 只负责「装工具链 → 跑 python -m kbx → 传产物」。
# 所有构建逻辑在 kbx/ 里，可本地单测、可本地 plan。
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Android 版本"
        type: choice
        default: android14
        options: [android12, android13, android14, android15, android16]
      kernel:
        description: "内核版本"
        type: choice
        default: "6.1"
        options: ["5.10", "5.15", "6.1", "6.6", "6.12"]
      sub_level:
        description: "子版本号（或填 X 表示 LTS）"
        type: string
        default: "138"
      os_patch_level:
        description: "安全补丁级别（YYYY-MM 或 latest）"
        type: string
        default: latest
      ksu:
        description: "KernelSU 版本（见 kbx list-refs）"
        type: choice
        default: sukisu-13000
        options: [sukisu-13000, sukisu-12807, sukisu-stable, official-stable, next-stable, resukisu-stable]
      features:
        description: "功能（逗号分隔）"
        type: string
        default: "susfs,kpm,zram_enhanced,zram_full_algos,bbg,ntsync,net_enhanced,rekernel"
      zram_algos:
        description: "额外 ZRAM 算法（逗号分隔，可留空）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  plan:
    name: Plan（快速失败）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 单元测试（纯标准库，无需安装依赖）
        run: python -m unittest discover -s tests
      - name: 打印构建计划
        run: |
          python -m kbx plan \
            --android "${{ inputs.android }}" \
            --kernel "${{ inputs.kernel }}" \
            --sub-level "${{ inputs.sub_level }}" \
            --os-patch-level "${{ inputs.os_patch_level }}" \
            --ksu "${{ inputs.ksu }}" \
            --with "${{ inputs.features }}" \
            --zram-algos "${{ inputs.zram_algos }}" | tee plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.android }}-${{ inputs.kernel }}.${{ inputs.sub_level }}
          path: plan.txt

  build:
    name: Build ${{ inputs.android }}-${{ inputs.kernel }}.${{ inputs.sub_level }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libelf-dev libssl-dev \
            python3 rsync unzip zip

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kbx-${{ inputs.android }}-${{ inputs.kernel }}

      - name: 构建
        run: |
          python -m kbx build \
            --android "${{ inputs.android }}" \
            --kernel "${{ inputs.kernel }}" \
            --sub-level "${{ inputs.sub_level }}" \
            --os-patch-level "${{ inputs.os_patch_level }}" \
            --ksu "${{ inputs.ksu }}" \
            --with "${{ inputs.features }}" \
            --zram-algos "${{ inputs.zram_algos }}" \
            --out out

      - name: 产物概览
        if: always()
        run: |
          echo "## 构建产物" >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/build-manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没找到 manifest（构建可能失败）" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -lh out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kbx-${{ inputs.android }}-${{ inputs.kernel }}.${{ inputs.sub_level }}
          path: |
            out/*.zip
            out/*.img
            out/*.apk
            out/ksud
            out/build-manifest.json
          if-no-files-found: warn
